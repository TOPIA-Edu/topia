<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>TOPIA 차량 운행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e8ecf2;
    --p:#1f4fd8;--p-soft:#eaf0ff;--ok:#0e9f6e;--ok-soft:#e7f7f0;--warn:#b45309;--warn-soft:#fff6e6;
    --r:18px;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0b1020;--card:#151b2e;--ink:#eef2ff;--sub:#94a3b8;--line:#232b42;--p:#5b8cff;--p-soft:#1b2747;--ok:#34d399;--ok-soft:#10261f;--warn:#fbbf24;--warn-soft:#2a2210}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.01em}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hide{display:none!important}
  .page{max-width:520px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

  /* 상단 */
  .top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;max-width:520px;margin:0 auto}
  .car{display:flex;align-items:baseline;gap:8px}
  .car b{font-size:26px;font-weight:800}
  .car span{font-size:14px;color:var(--sub)}
  .date{font-size:14px;color:var(--sub);margin-top:2px}
  .days{display:flex;gap:6px;margin-top:12px}
  .day{flex:1;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:16px;font-weight:700;color:var(--sub);position:relative}
  .day.on{background:var(--p);color:#fff}
  .day.today::after{content:"오늘";position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:9px;font-weight:800;background:var(--ok);color:#fff;border-radius:6px;padding:1px 4px}
  .day:disabled{opacity:.35}

  /* 오늘의 운행 */
  .sec{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 10px}
  .run{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:10px;border:2px solid transparent}
  .run .tm{min-width:74px}
  .run .tm b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .run .tm small{font-size:12px;color:var(--sub)}
  .run .info{flex:1;min-width:0}
  .tag{display:inline-block;font-size:12px;font-weight:800;border-radius:7px;padding:3px 7px;margin-right:6px}
  .tag.to{background:var(--p-soft);color:var(--p)} .tag.from{background:var(--warn-soft);color:var(--warn)}
  .run .grp{font-size:13px;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .run .st{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
  .run.next{border-color:var(--p)} .run.next .st{color:var(--p)}
  .run.done{opacity:.55} .run.done .st{color:var(--ok)}
  .run.live{border-color:var(--ok)} .run.live .st{color:var(--ok)}
  .empty{background:var(--card);border-radius:var(--r);padding:28px;text-align:center;color:var(--sub);box-shadow:var(--shadow)}
  .rule{display:flex;gap:8px;font-size:13px;line-height:1.5;color:var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin-top:6px}

  /* 하단 고정 버튼 */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .dock .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:60px;border-radius:16px;font-size:18px;font-weight:800;background:var(--p);color:#fff;box-shadow:0 6px 18px rgba(31,79,216,.28)}
  .btn.ok{background:var(--ok);box-shadow:0 6px 18px rgba(14,159,110,.28)}
  .btn.ghost{height:48px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:15px;font-weight:700}
  .btn small{font-weight:600;opacity:.85;font-size:14px}

  /* 운행 중 */
  .runhead{display:flex;align-items:center;gap:10px;margin-top:4px}
  .runhead .back{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px}
  .runhead b{font-size:17px}
  .now{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-top:14px}
  .now .lbl{font-size:13px;font-weight:800;color:var(--p)}
  .now .nm{font-size:25px;font-weight:800;line-height:1.3;margin:8px 0 6px;word-break:keep-all}
  .now .eta{font-size:15px;color:var(--sub)}
  .prog{display:flex;gap:4px;margin-top:16px}
  .prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .prog i.d{background:var(--ok)} .prog i.c{background:var(--p)}
  .navi{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin-top:16px;border-radius:12px;background:var(--p-soft);color:var(--p);font-weight:800;font-size:15px;text-decoration:none}
  #map{height:200px;border-radius:var(--r);margin-top:12px;background:var(--line);overflow:hidden}
  .stops{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .stops li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
  .stops li:last-child{border-bottom:0}
  .stops .no{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--line);color:var(--sub)}
  .stops .t{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
  .stops li.d{color:var(--sub)} .stops li.d .no{background:var(--ok);color:#fff}
  .stops li.c{background:var(--p-soft);font-weight:700} .stops li.c .no{background:var(--p);color:#fff}
  .undo{display:block;margin:14px auto 0;font-size:14px;color:var(--sub);text-decoration:underline}

  /* 완료 */
  .doneCard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:28px 20px;margin-top:16px;text-align:center}
  .doneCard .ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .doneCard b{font-size:22px}
  .doneCard p{color:var(--sub);margin:6px 0 0;font-size:15px}
  .mk{font-weight:800;font-size:12px;border-radius:12px;padding:3px 7px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);background:#94a3b8;color:#fff}
  .mk.d{background:#0e9f6e}.mk.c{background:#1f4fd8;font-size:14px}
  .msg{padding:80px 24px;text-align:center;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
<div id="pvBar"></div>
<div class="top" id="top">
  <div class="car"><b id="carName">TOPIA 차량</b><span id="carArea"></span></div>
  <div class="date" id="today"></div>
  <div class="days" id="days"></div>
</div>

<main class="page">
  <!-- 오늘의 운행 -->
  <section id="vList" class="hide">
    <div class="sec" id="listTitle">오늘의 운행</div>
    <div id="runs"></div>
    <div class="rule">⚠️<span>탑승 학생이 없어도 모든 정류장을 순서대로 들러 주세요.</span></div>
  </section>

  <!-- 운행 중 -->
  <section id="vRun" class="hide">
    <div class="runhead"><button class="back" id="toList" aria-label="운행 목록">‹</button><b id="runTitle"></b></div>
    <div class="now">
      <div class="lbl" id="nowLbl"></div>
      <div class="nm" id="nowNm"></div>
      <div class="eta" id="nowEta"></div>
      <div class="prog" id="prog"></div>
      <a class="navi" id="naviAgain">🧭 카카오내비 다시 열기</a>
    </div>
    <div id="map"></div>
    <ul class="stops" id="stops"></ul>
    <button class="undo" id="undo">이전 정류장으로 되돌리기</button>
  </section>

  <!-- 운행 완료 -->
  <section id="vDone" class="hide">
    <div class="doneCard">
      <div class="ic">✓</div>
      <b id="doneTitle">운행 완료</b>
      <p id="doneSub"></p>
    </div>
  </section>

  <div id="vMsg" class="msg hide"></div>
</main>

<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script>
/* ===== 설정 ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbyBM7Q_GttPSPZfK6nDXtPWDqNc6ect2rx8jik2E8j66uuEJXqF2YQqlXJ72ojDUiqr1Q/exec";
const KAKAO_JS_KEY = "719d78d4fe57fc239d2ec38aa07bdbbe";
const SCHOOL = { n: "TOPIA어학원 중계캠퍼스", q: "서울 노원구 한글비석로 276" };
/* ================ */

const $ = s => document.querySelector(s);
const DAYS = ["일","월","화","수","목","금","토"];
const now = new Date();
const todayDay = DAYS[now.getDay()];
const token = new URLSearchParams(location.search).get("t") || "";
let D = null, day = todayDay, run = null, idx = 0, map = null, marks = [];
const st = { done: [], live: null };   // 오늘 완료한 운행, 진행 중 운행

const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const min = t => { const [h,m] = String(t).split(":").map(Number); return h*60+m; };
const hm12 = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); return `${((h+11)%12)+1}:${pad(m)}`; };
const ap = t => t ? (min(t) < 720 ? "오전" : "오후") : "";
const clean = n => String(n).replace(/_하원시 3호탑승/,"");
const KEY = () => `topia-day-${token || (D && D.car)}-${ymd(now)}`;
function save(){ try{ localStorage.setItem(KEY(), JSON.stringify(st)); }catch(e){} }
function load(){ try{ Object.assign(st, JSON.parse(localStorage.getItem(KEY())||"{}")); }catch(e){} }

try { Kakao.init(KAKAO_JS_KEY); } catch(e) {}

/* ---------- 데이터 ---------- */
function start(data){
  D = data; load();
  $("#carName").textContent = `${D.car} 차량`;
  $("#carArea").textContent = D.area;
  $("#today").textContent = `${now.getMonth()+1}월 ${now.getDate()}일 (${todayDay})`;
  renderDays();
  if(st.live){ const r = trips(todayDay).find(x=>x.id===st.live.id); if(r){ run=r; idx=st.live.idx; return showRun(); } }
  showList();
}
if(window.PREVIEW_DATA){ /* 미리보기 */ }
else if(!token) fail("링크가 올바르지 않습니다.<br>학원에서 받은 링크로 접속해 주세요.");
else fetch(`${API_URL}?t=${encodeURIComponent(token)}`).then(r=>r.json())
  .then(res => res.ok ? start(res.data) : fail(res.error))
  .catch(() => fail("운행 정보를 불러오지 못했습니다.<br>인터넷 연결을 확인해 주세요."));

/* 같은 요일·같은 구분·같은 시각의 운행은 한 번의 운행으로 합칩니다 */
function trips(d){
  const map = {};
  D.runs.filter(r => r.days.includes(d)).forEach(r => {
    const startT = r.dir==="to" ? (r.times[0] || r.cls) : r.cls;
    const k = r.dir + startT;
    if(!map[k]) map[k] = { id: k, dir: r.dir, start: startT, cls: r.cls, times: r.times, grps: [] };
    map[k].grps.push(r.grp);
  });
  return Object.values(map).sort((a,b)=>min(a.start)-min(b.start));
}
function stopsOf(r){ return r.dir==="to" ? D.stops : D.stops.slice().reverse(); }

/* ---------- 요일 ---------- */
function renderDays(){
  const box = $("#days"); box.innerHTML = "";
  ["월","화","수","목","금","토"].forEach(d => {
    const b = document.createElement("button");
    b.className = "day" + (d===day?" on":"") + (d===todayDay?" today":"");
    b.textContent = d; b.disabled = !D.runs.some(r=>r.days.includes(d));
    b.onclick = () => { day = d; renderDays(); showList(); };
    box.appendChild(b);
  });
}

/* ---------- 오늘의 운행 ---------- */
function nextTrip(list){
  const cur = now.getHours()*60 + now.getMinutes();
  const open = list.filter(r => !st.done.includes(r.id));
  return open.find(r => min(r.start) >= cur - 20) || open[0] || null;
}
function showList(){
  view("vList");
  const list = trips(day), isToday = day===todayDay;
  $("#listTitle").textContent = isToday ? `오늘의 운행 · ${list.length}회` : `${day}요일 운행 · ${list.length}회`;
  const nx = isToday ? nextTrip(list) : null;
  const box = $("#runs"); box.innerHTML = "";
  if(!list.length) box.innerHTML = '<div class="empty">이 요일에는 운행이 없습니다.</div>';
  list.forEach(r => {
    const done = isToday && st.done.includes(r.id), live = isToday && st.live && st.live.id===r.id;
    const b = document.createElement("button");
    b.className = "run" + (done?" done":"") + (live?" live":(r===nx?" next":""));
    b.innerHTML = `<div class="tm"><small>${ap(r.start)}</small><b>${hm12(r.start)}</b></div>
      <div class="info"><span class="tag ${r.dir}">${r.dir==="to"?"등원":"하원"}</span><b style="font-size:15px">${r.dir==="to"?"수업 "+ap(r.cls)+" "+hm12(r.cls):"학원 출발"}</b>
      <div class="grp">${r.grps.join(" · ")} · 정류장 ${D.stops.length}곳</div></div>
      <div class="st">${done?"완료 ✓":live?"운행 중":r===nx?"다음":""}</div>`;
    b.onclick = () => begin(r);
    box.appendChild(b);
  });
  const target = (isToday && st.live) ? list.find(r=>r.id===st.live.id) : nx;
  dock(target ? [{ cls:"btn", html: st.live ? `운행 이어하기 <small>${tripLabel(target)}</small>` : `운행 시작 <small>${tripLabel(target)}</small>`, fn: () => begin(target) }] : []);
}
function tripLabel(r){ return `${ap(r.start)} ${hm12(r.start)} ${r.dir==="to"?"등원":"하원"}`; }

/* ---------- 운행 ---------- */
function begin(r){
  if(!st.live || st.live.id!==r.id){ idx = 0; }
  else idx = st.live.idx;
  run = r; st.live = { id: r.id, idx }; save();
  showRun();
  if(idx===0) navi(stopsOf(run)[0]);
}
function showRun(){
  view("vRun"); $("#top").classList.add("hide");
  const S = stopsOf(run), t = S[idx];
  $("#runTitle").textContent = `${tripLabel(run)} · ${run.grps.join(" · ")}`;
  $("#nowLbl").textContent = `정류장 ${idx+1} / ${S.length}`;
  $("#nowNm").textContent = clean(t.n);
  $("#nowEta").textContent = run.dir==="to" && run.times[idx] ? `도착 예정 ${ap(run.times[idx])} ${hm12(run.times[idx])}` : (run.dir==="from" ? "하원 정류장" : "");
  $("#prog").innerHTML = S.map((_,i)=>`<i class="${i<idx?"d":i===idx?"c":""}"></i>`).join("");
  $("#naviAgain").onclick = e => { e.preventDefault(); navi(t); };
  $("#stops").innerHTML = S.map((s,i)=>`<li class="${i<idx?"d":i===idx?"c":""}"><span class="no">${i<idx?"✓":i+1}</span><span>${clean(s.n)}</span><span class="t">${run.dir==="to"&&run.times[i]?hm12(run.times[i]):""}</span></li>`).join("");
  $("#undo").classList.toggle("hide", idx===0);
  const last = idx===S.length-1;
  dock([{ cls:"btn ok", html: last ? (run.dir==="to" ? "도착 · 학원으로 이동" : "도착 · 운행 종료") : `도착 · 다음 정류장 <small>${clean(S[idx+1].n).slice(0,12)}</small>`, fn: arrive }]);
  drawMap();
  window.scrollTo({ top: 0 });
}
function arrive(){
  const S = stopsOf(run);
  if(idx < S.length-1){ idx++; st.live.idx = idx; save(); showRun(); navi(S[idx]); return; }
  // 마지막 정류장 도착
  const toSchool = run.dir==="to";
  finish();
  if(toSchool) navi(null, true);
}
function finish(){
  if(!st.done.includes(run.id)) st.done.push(run.id);
  st.live = null; save();
  view("vDone"); $("#top").classList.add("hide");
  const list = trips(todayDay), nx = nextTrip(list);
  $("#doneTitle").textContent = `${tripLabel(run)} 완료`;
  if(nx){
    const gap = min(nx.start) - (now.getHours()*60+now.getMinutes());
    $("#doneSub").textContent = run.dir==="to" ? "학원 도착 후 다음 운행을 시작해 주세요." : "수고하셨습니다.";
    dock([
      { cls:"btn", html: `다음 운행 시작 <small>${tripLabel(nx)}${gap>0?` · ${gap}분 후`:""}</small>`, fn: () => { $("#top").classList.remove("hide"); begin(nx); } },
      { cls:"btn ghost", html: "오늘 운행 목록 보기", fn: () => { $("#top").classList.remove("hide"); showList(); } }
    ]);
  } else {
    $("#doneSub").textContent = "오늘 운행을 모두 마쳤습니다. 수고하셨습니다!";
    dock([{ cls:"btn ghost", html: "오늘 운행 목록 보기", fn: () => { $("#top").classList.remove("hide"); showList(); } }]);
  }
}
$("#undo").onclick = () => { if(idx>0){ idx--; st.live.idx = idx; save(); showRun(); } };
$("#toList").onclick = () => { $("#top").classList.remove("hide"); day = todayDay; renderDays(); showList(); };

/* ---------- 카카오내비 ---------- */
function navi(s, school){
  if(window.PREVIEW_DATA) return;   // 미리보기에서는 실행하지 않음
  try{
    if(school){ location.href = `https://map.kakao.com/link/search/${encodeURIComponent(SCHOOL.q)}`; return; }
    Kakao.Navi.start({ name: clean(s.n), x: s.lng, y: s.lat, coordType: "wgs84" });
  }catch(e){
    if(s) window.open(`https://map.kakao.com/link/to/${encodeURIComponent(clean(s.n))},${s.lat},${s.lng}`, "_blank");
  }
}

/* ---------- 지도 ---------- */
function drawMap(){
  if(!window.kakao || !kakao.maps){ loadMap(); return; }
  if(!map) map = new kakao.maps.Map($("#map"), { center: new kakao.maps.LatLng(37.65,127.07), level: 5 });
  marks.forEach(m=>m.setMap(null)); marks = [];
  const S = stopsOf(run), b = new kakao.maps.LatLngBounds(), path = [];
  S.forEach((s,i)=>{ const p = new kakao.maps.LatLng(s.lat,s.lng); path.push(p); b.extend(p);
    marks.push(new kakao.maps.CustomOverlay({ map, position:p, yAnchor:.5, content:`<div class="mk ${i<idx?"d":i===idx?"c":""}">${i+1}</div>` })); });
  marks.push(new kakao.maps.Polyline({ map, path, strokeWeight:3, strokeColor:"#1f4fd8", strokeOpacity:.5, strokeStyle:"shortdash" }));
  map.setBounds(b, 24,24,24,24);
}
function loadMap(){
  if(window.PREVIEW_DATA){ $("#map").classList.add("hide"); return; }
  if(document.getElementById("kmap")) return;
  const sc = document.createElement("script"); sc.id = "kmap";
  sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  sc.onload = () => kakao.maps.load(drawMap);
  sc.onerror = () => $("#map").classList.add("hide");
  document.head.appendChild(sc);
}

/* ---------- 공통 ---------- */
function view(id){ ["vList","vRun","vDone","vMsg"].forEach(v => $("#"+v).classList.toggle("hide", v!==id)); }
function dock(btns){
  $("#dock").classList.toggle("hide", !btns.length);
  const box = $("#dockIn"); box.innerHTML = "";
  btns.forEach(o => { const b = document.createElement("button"); b.className = o.cls; b.innerHTML = o.html; b.onclick = o.fn; box.appendChild(b); });
}
function fail(t){ $("#top").classList.add("hide"); view("vMsg"); $("#vMsg").innerHTML = t; dock([]); }
</script>
</body>
</html>
